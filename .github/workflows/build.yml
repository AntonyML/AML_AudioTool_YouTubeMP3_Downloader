name: 🔨 CI Build (Windows)

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main

# Cancelar corridas duplicadas en el mismo PR/rama
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 📦 Validate Build
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏗️ Build Windows (portable EXE)
        run: npm run build:win
        # Sin GH_TOKEN para evitar que electron-builder intente publicar

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-win
          path: dist/
          if-no-files-found: warn
          retention-days: 7
