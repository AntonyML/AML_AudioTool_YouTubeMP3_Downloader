name: 🔨 CI Build

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main

# Cancelar corridas duplicadas en el mismo PR/rama
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 📦 Validate Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        include:
          - os: windows-latest
            build_script: build:win
            artifact_suffix: win-x64
          - os: ubuntu-latest
            build_script: build:linux
            artifact_suffix: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏗️ Build for ${{ matrix.os }}
        run: npm run ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload artifacts (${{ matrix.artifact_suffix }})
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact_suffix }}
          path: dist/
          if-no-files-found: warn
          retention-days: 7
