name: 🚀 Release (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Marcar como pre-release'
        type: boolean
        default: false

# Permisos necesarios para crear releases y etiquetas
permissions:
  contents: write
  discussions: write

jobs:
  # ──────────────────────────────────────────────
  # PRE-RELEASE: Extraer / armar la información de versión
  # ──────────────────────────────────────────────
  prepare:
    name: 📋 Prepare Release Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📐 Resolve version & tag info
        id: resolve
        shell: bash
        run: |
          # Obtener el tag semver más alto
          LATEST_TAG="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1 || echo 'v0.0.0')"
          LATEST="${LATEST_TAG#v}"
          IFS='.' read -r -a PARTS <<< "$LATEST"
          MAJOR="${PARTS[0]:-0}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"
          # Auto-bump patch
          NEW_PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          TAG="v${VERSION}"

          echo "tag=${TAG}"                   >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"           >> "$GITHUB_OUTPUT"

          # Determinar si es pre-release
          if [[ "${VERSION}" == *-* ]] || [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            echo "is_prerelease=true"          >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false"         >> "$GITHUB_OUTPUT"
          fi

      - name: ✅ Summary
        shell: bash
        run: |
          echo "────────────────────────────────────────"
          echo "  Tag         : ${{ steps.resolve.outputs.tag }}"
          echo "  Version     : ${{ steps.resolve.outputs.version }}"
          echo "  Pre-release : ${{ steps.resolve.outputs.is_prerelease }}"
          echo "────────────────────────────────────────"

  # ──────────────────────────────────────────────
  # BUILD: Empaquetar la app en Windows (EXE portable)
  # ──────────────────────────────────────────────
  build:
    name: 🏗️ Build Windows
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏗️ Build Windows (portable EXE)
        run: npm run build:win -- --publish=never

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AML-Audio-Tool-Windows
          path: dist/
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # RELEASE: Crear GitHub Release con los assets
  # ──────────────────────────────────────────────
  release:
    name: 🚀 Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository (with tags for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 🧹 Filter distributable assets (keep only EXE + updater files)
        shell: bash
        run: |
          echo "─── Assets before filtering ───"
          find release-assets -type f | sort | wc -l
          echo " total files"
          echo ""
          echo "Keeping only: *.exe, latest*.yml, app-update.yml"
          echo "(Removing ~150+ Electron runtime internals: .pak, .so, .dll, .bin, .dat, etc.)"
          find release-assets -type f \
            ! -name '*.exe' \
            ! -name 'latest*.yml' \
            ! -name 'app-update.yml' \
            -delete
          echo ""
          echo "─── Assets to publish ───"
          find release-assets -type f | sort
          echo "─────────────────────────"

      - name: 🏷️ Create/update Git tag
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.prepare.outputs.tag }}';
            const sha = context.sha;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: sha
              });
              console.log(`✅ Tag ${tag} created @ ${sha}`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`⚠️  Tag ${tag} already exists, reusing it`);
              } else {
                throw e;
              }
            }

      # ── Sincronizar package.json con la versión del tag ──
      - name: 📝 Sync package.json version
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('✅ package.json version → ${VERSION}');
          "

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: ${{ github.workspace }}/.github/release-template.md
          fail_on_unmatched_files: false
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔗 Release URL
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          REPO="${{ github.repository }}"
          echo "✅ Release created: https://github.com/${REPO}/releases/tag/${TAG}"
