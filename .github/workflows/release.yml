name: 🚀 Release (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Marcar como pre-release'
        type: boolean
        default: false

# Permisos necesarios para crear releases y etiquetas
permissions:
  contents: write
  discussions: write

jobs:
  # ──────────────────────────────────────────────
  # PRE-RELEASE: Extraer / armar la información de versión
  # ──────────────────────────────────────────────
  prepare:
    name: 📋 Prepare Release Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📐 Resolve version & tag info
        id: resolve
        shell: bash
        run: |
          # Obtener el tag semver más alto
          LATEST_TAG="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1 || echo 'v0.0.0')"
          LATEST="${LATEST_TAG#v}"
          IFS='.' read -r -a PARTS <<< "$LATEST"
          MAJOR="${PARTS[0]:-0}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"
          # Auto-bump patch
          NEW_PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          TAG="v${VERSION}"

          echo "tag=${TAG}"                   >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"           >> "$GITHUB_OUTPUT"

          # Determinar si es pre-release
          if [[ "${VERSION}" == *-* ]] || [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            echo "is_prerelease=true"          >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false"         >> "$GITHUB_OUTPUT"
          fi

      - name: ✅ Summary
        shell: bash
        run: |
          echo "────────────────────────────────────────"
          echo "  Tag         : ${{ steps.resolve.outputs.tag }}"
          echo "  Version     : ${{ steps.resolve.outputs.version }}"
          echo "  Pre-release : ${{ steps.resolve.outputs.is_prerelease }}"
          echo "────────────────────────────────────────"

  # ──────────────────────────────────────────────
  # BUILD: Empaquetar la app en Windows (EXE portable)
  # ──────────────────────────────────────────────
  build:
    name: 🏗️ Build Windows
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📝 Sync package.json version
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('✅ package.json version → ${VERSION}');
          "

      - name: 📥 Install dependencies
        run: npm ci

      - name: 📦 Download ffmpeg + yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Write-Host "⬇️ Downloading yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile bin\yt-dlp.exe
          Write-Host "⬇️ Downloading ffmpeg.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          Copy-Item ffmpeg-tmp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe bin\ffmpeg.exe -Force
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg-tmp
          Write-Host "✅ ffmpeg.exe + yt-dlp.exe listos en bin/"

      - name: 🏗️ Build Windows (portable EXE)
        run: npm run build:win -- --publish=never

      - name: 📤 Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/
          if-no-files-found: error

      - name: 📤 Upload binary dependencies
        uses: actions/upload-artifact@v4
        with:
          name: app-bins
          path: bin/
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # RELEASE: Crear GitHub Release con los assets
  # ──────────────────────────────────────────────
  release:
    name: 🚀 Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository (with tags for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download app build
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: release-assets

      - name: 📥 Download binary dependencies
        uses: actions/download-artifact@v4
        with:
          name: app-bins
          path: release-assets

      - name: 🧹 Filter distributable assets
        shell: bash
        run: |
          echo "─── Assets before filtering ───"
          find release-assets -type f | sort
          echo ""
          echo "Keeping only: portable EXE, ffmpeg.exe, yt-dlp.exe, latest*.yml"
          echo "(Removing win-unpacked runtime files, elevate.exe, debug logs, etc.)"
          find release-assets -type f \
            ! -name 'AML Audio Tool *.exe' \
            ! -name 'ffmpeg.exe' \
            ! -name 'yt-dlp.exe' \
            ! -name 'latest*.yml' \
            -delete
          echo ""
          echo "─── Assets to publish ───"
          find release-assets -type f | sort
          echo "─────────────────────────"

      - name: ⚡ Upload mirrors (Catbox + GoFile)
        shell: bash
        run: |
          EXE_PATH=$(find release-assets -name 'AML Audio Tool *.exe' | head -n1)
          if [ -z "$EXE_PATH" ]; then
            echo "❌ No se encontró el EXE"
            exit 1
          fi
          FILENAME=$(basename "$EXE_PATH")
          echo "⬆️ Subiendo: $FILENAME"

          # ── CATBOX ──
          echo "📤 Subiendo a Catbox..."
          CATBOX_URL=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@${EXE_PATH}" https://catbox.moe/user/api.php)
          if echo "$CATBOX_URL" | grep -q "^https\?://"; then
            echo "   ✅ $CATBOX_URL"
          else
            echo "   ⚠️ Error: $CATBOX_URL"
            CATBOX_URL=""
          fi

          # ── GOFILE ──
          echo "📤 Subiendo a GoFile..."
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          GOFILE_RESULT=$(curl -s -F "file=@${EXE_PATH}" "https://${SERVER}.gofile.io/contents/uploadfile")
          GOFILE_URL=$(echo "$GOFILE_RESULT" | jq -r '.data.downloadPage')
          echo "   ✅ $GOFILE_URL"

          # ── GUARDAR URLs para el release body ──
          echo "CATBOX_URL=${CATBOX_URL:-}" >> "$GITHUB_ENV"
          echo "GOFILE_URL=${GOFILE_URL:-}" >> "$GITHUB_ENV"

      - name: 📝 Build release body with mirror links
        shell: bash
        run: |
          cat .github/release-template.md > release-body.md
          echo "" >> release-body.md
          echo "---" >> release-body.md
          echo "" >> release-body.md
          echo "### ⚡ Descarga rápida" >> release-body.md
          echo "" >> release-body.md
          echo "| Mirror | Link |" >> release-body.md
          echo "|--------|------|" >> release-body.md
          if [ -n "${{ env.CATBOX_URL }}" ]; then
            echo "| 🐱 Catbox | [${{ env.CATBOX_URL }}](${{ env.CATBOX_URL }}) |" >> release-body.md
          fi
          if [ -n "${{ env.GOFILE_URL }}" ]; then
            echo "| 📁 GoFile | [${{ env.GOFILE_URL }}](${{ env.GOFILE_URL }}) |" >> release-body.md
          fi

      - name: 🏷️ Create/update Git tag
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.prepare.outputs.tag }}';
            const sha = context.sha;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: sha
              });
              console.log(`✅ Tag ${tag} created @ ${sha}`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`⚠️  Tag ${tag} already exists, reusing it`);
              } else {
                throw e;
              }
            }

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release-body.md
          fail_on_unmatched_files: false
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔗 Release URL
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          REPO="${{ github.repository }}"
          echo "✅ Release created: https://github.com/${REPO}/releases/tag/${TAG}"
